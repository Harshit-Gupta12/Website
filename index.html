<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern E-Commerce Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Header -->
    <header class="navbar">
        <div class="logo">ShopEase</div>
        <nav>
            <button id="cart-btn" class="cart-btn">
                🛒 Cart (<span id="cart-count">0</span>)
            </button>
        </nav>
    </header>

    <!-- Main Content Layout -->
    <main class="container">
        <!-- Sidebar Filter -->
        <aside class="sidebar">
            <h3>Categories</h3>
            <ul>
                <li><button class="filter-btn active" data-category="all">All Products</button></li>
                <li><button class="filter-btn" data-category="electronics">Electronics</button></li>
                <li><button class="filter-btn" data-category="fashion">Fashion</button></li>
            </ul>
        </aside>

        <!-- Product Grid -->
        <section class="products-grid" id="products-container">
            <!-- Products injected by JavaScript -->
        </section>
    </main>

    <!-- Cart Drawer Modal -->
    <div id="cart-modal" class="cart-modal">
        <div class="cart-content">
            <div class="cart-header">
                <h2>Your Shopping Cart</h2>
                <span id="close-cart" class="close-btn">&times;</span>
            </div>
            <div id="cart-items" class="cart-items">
                <!-- Cart items injected by JavaScript -->
            </div>
            <div class="cart-footer">
                <h3>Total: $<span id="cart-total">0.00</span></h3>
                <button id="checkout-btn" class="checkout-btn">Checkout</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
